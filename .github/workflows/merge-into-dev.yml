name: "Merge PR into branch develop"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build-docker-frontend:
    name: '[Frontend] Build Docker'
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .env file
        run: |
          cat <<EOF > ./frontend/.env
          ${{ vars.FRONTEND_ENV }}
          EOF
      - name: Build frontend
        uses: ./.github/actions/build-docker
        with:
          # SERVICE PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # IMAGE DETAILS
          azure-registry: 0g3fdxcei4ilquet
          context: frontend
          dockerfile: frontend/Dockerfile
          image-name: frontend
          push: true
          tag: beta
  backend-build-docker:
    name: '[Backend] Build Docker'
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up .env file
        run: |
          cat <<EOF > ./backend/.env
          ${{ vars.BACKEND_ENV }}
          EOF
      - name: Build frontend
        uses: ./.github/actions/build-docker
        with:
          # SERVICE PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          # IMAGE DETAILS
          azure-registry: 0g3fdxcei4ilquet
          context: backend
          dockerfile: backend/Dockerfile
          image-name: backend
          push: true
          tag: beta