name: "Dev pipeline"

on:
  push:
    branches:
      - dev
      - features/cicd

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  docker-build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get env from Github vars
        run: |
          echo '${{ vars.BACKEND_ENV }}' >> backend/.env
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          push: false
          tags: backend:latest
          context: backend
          file: backend/Dockerfile
