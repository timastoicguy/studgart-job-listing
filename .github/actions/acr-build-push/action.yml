name: "Docker build push to ACR"
description: "Use docker commands to build and push image to ACR"

inputs:
  working-directory:
    description: "Working directory"
    required: true
  subscription-id:
    description: "Azure subscription ID"
    required: true
  client-id:
    description: "Azure client ID"
    required: true
  tenant-id:
    description: "Azure tenant ID"
    required: true
  dockerfile-location:
    description: "Dockerfile location"
    required: true
  acr-name:
    description: "ACR name"
    required: true
  image-name:
    description: "Image name"
    required: true
  image-tag:
    description: "Image tag"
    required: true
  push:
    description: "Push image to ACR"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout branch
      uses: actions/checkout@v4
    - name: Set up Azure
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
    - name: Log in to ACR
      shell: bash
      run: az acr login -n ${{ inputs.acr-name }}
    - name: Docker build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: docker build -t ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.image-tag }} -f ${{ inputs.dockerfile-location }} .
    - name: Docker push
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: docker push ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}
