{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
  namespace: {{ .Release.Namespace }}
  {{- if .Values.httproute.labels }}
  labels:
    {{- toYaml .Values.httproute.labels | nindent 4 }}
  {{- end }}
  {{- if .Values.httproute.annotations }}
  annotations:
    {{- toYaml .Values.httproute.annotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  - name: {{ .Values.httproute.parentRef.name | default "traefik-gateway" }}
    namespace: {{ .Values.httproute.parentRef.namespace | default "traefik" }}
    {{- if .Values.httproute.parentRef.sectionName }}
    sectionName: {{ .Values.httproute.parentRef.sectionName }}
    {{- end }}
    {{- if .Values.httproute.parentRef.port }}
    port: {{ .Values.httproute.parentRef.port }}
    {{- end }}
  hostnames:
  {{- range .Values.httproute.hostnames }}
  - {{ . }}
  {{- end }}
  rules:
  {{- range .Values.httproute.rules | default (list (dict "path" (dict "type" "PathPrefix" "value" "/"))) }}
  - matches:
    {{- if .path }}
    - path:
        type: {{ .path.type | default "PathPrefix" }}
        value: {{ .path.value | default "/" }}
    {{- end }}
    {{- if .headers }}
    - headers:
      {{- toYaml .headers | nindent 8 }}
    {{- end }}
    {{- if .method }}
    - method: {{ .method }}
    {{- end }}
    {{- if .query }}
    - queryParams:
      {{- toYaml .query | nindent 8 }}
    {{- end }}
    backendRefs:
    {{- if .backendRefs }}
    {{- toYaml .backendRefs | nindent 4 }}
    {{- else }}
    - name: {{ $.Values.service.name | default $.Release.Name }}
      namespace: {{ $.Release.Namespace }}
      port: {{ $.Values.service.port | default 80 }}
    {{- end }}
  {{- end }}
{{- end }}